jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify historical CMS EXEC archives
        run: |
          python3 -m py_compile scripts/restore-cms-exec.py
          python3 scripts/restore-cms-exec.py MISSING
      - name: Restore historical native tree wrappers
        run: python3 scripts/restore-ph-wrappers.py ALL
      - name: Test CP-to-Hercules read-only minidisk correlation
        run: bash tests/check-canonical-source.sh MAP
      - name: Test read-only Hercules config inventory
        run: bash tests/check-canonical-source.sh CONFIG
      - name: Test offline-only DASD backup safeguards
        run: bash tests/check-canonical-source.sh BACKUP
      - name: Enforce read-only CMS CATHEX gate and cleanup hold
        run: sh tests/check-canonical-source.sh READONLY
      - name: Reject unknown consolidated safety selectors
        run: |
          if sh tests/check-canonical-source.sh UNKNOWN; then exit 1; fi
          if sh tests/check-canonical-source.sh MAP EXTRA; then exit 1; fi
      - name: Check verified modern REF2 read-only bridge
        run: sh tests/check-canonical-source.sh VREF
      - name: Check compact CMS target gate source
        run: sh tests/check-canonical-source.sh M155
      - name: Check M156 authenticated presence duration
        run: python3 tests/test-m203-bounded-batch.py PHIST M156
      - name: Check M157 authenticated current presence age
        run: python3 tests/test-m203-bounded-batch.py PHIST M157
      - name: Check M158 authenticated presence time
        run: python3 tests/test-m203-bounded-batch.py PHIST M158
      - name: Check M159 authenticated presence ratio
        run: python3 tests/test-m203-bounded-batch.py PHIST M159
      - name: Check M160 authenticated presence coverage
        run: python3 tests/test-m203-bounded-batch.py PHIST M160
      - name: Check M161 authenticated presence frontier
        run: python3 tests/test-m203-bounded-batch.py PHIST M161
      - name: Check M162 authenticated frontier distance
        run: python3 tests/test-m203-bounded-batch.py PHIST M162
      - name: Check M163 authenticated complete presence horizon
        run: python3 tests/test-m203-bounded-batch.py PHIST M163
      - name: Check M164 practical CMS worktree porcelain
        run: python3 tests/test-m203-bounded-batch.py PMODEL M164
      - name: Check M165 staged commit object
        run: python3 tests/test-m203-bounded-batch.py PMODEL M165
      - name: Check M166 modern REF2 compare-and-swap
        run: python3 tests/test-m203-bounded-batch.py PMODEL M166
      - name: Check M167 integrated commit to ref
        run: python3 tests/test-m203-bounded-batch.py PMODEL M167
      - name: Check M168 current branch reconciliation
        run: python3 tests/test-m203-bounded-batch.py GINTEG M168
      - name: Check M169 generalized fetch discovery
        run: python3 tests/test-m203-bounded-batch.py GINTEG M169
      - name: Check M170 dynamic upload pack POST
        run: python3 tests/test-m203-bounded-batch.py GINTEG M170
      - name: Check M171 generalized PACK store
        run: python3 tests/test-m203-bounded-batch.py GINTEG M171
      - name: Check M172 generalized PACK census
        run: python3 tests/test-m203-bounded-batch.py NDATA M172-MAIN
      - name: Check M173 generalized OFS PACK import
        run: python3 tests/test-m203-bounded-batch.py NDATA M173-IMP
      - name: Check M174 generalized stage index
        run: python3 tests/test-m203-bounded-batch.py NDATA M174-MAIN
      - name: Check M175 verified generalized object access
        run: python3 tests/test-m203-bounded-batch.py NDATA M175-MAIN
      - name: Check M176 verified live tree closure
        run: python3 tests/test-m203-bounded-batch.py NDATA M176-MAIN
      - name: Check M177 safe explicit G stage index read-only view
        run: python3 tests/test-m203-bounded-batch.py M177
      - name: Check M178 forward-only C89 tree closure parity
        run: python3 tests/test-m203-bounded-batch.py M178
      - name: Check M179 read-only native phase profiling parity
        run: python3 tests/test-m203-bounded-batch.py M179
      - name: Check M180 one-pass authenticated tree parity
        run: python3 tests/test-m203-bounded-batch.py M180
      - name: Check M181 hex LUT selective tree parity
        run: python3 tests/test-m203-bounded-batch.py M181
      - name: Check M182 two-character hex LUT parity
        run: python3 tests/test-m203-bounded-batch.py M182
      - name: Check M183 skipped-body length/unroll parity
        run: python3 tests/test-m203-bounded-batch.py M183
      - name: Check M185 direct skipped-record validation parity
