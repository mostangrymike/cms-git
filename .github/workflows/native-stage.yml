      - name: Check M202 dual object full SHA and exact scratch cleanup
        run: python3 tests/test-m203-bounded-batch.py M202
      - name: Check M203 bounded batch Git SHA
        run: python3 tests/test-m203-bounded-batch.py M203
      - name: Check M204 index-once batch
        run: python3 tests/test-m203-bounded-batch.py M204
      - name: Check M205 sampled Git objects and full SHA1
        run: python3 tests/test-m203-bounded-batch.py M205
      - name: Check M206 up to 32 independently SHA-authenticated bands
        run: python3 tests/test-m203-bounded-batch.py M206
      - name: Check M190 7736-object selective seek closure
        run: python3 tests/test-m203-bounded-batch.py M190S
      - name: Compare M190 indexed seek vs M188 two-pass host
        run: python3 tests/test-m203-bounded-batch.py BENCH M190
      - name: Check M189 eight-way skipped-hex C89 parity
        run: python3 tests/test-m203-bounded-batch.py M189
      - name: Compare M189 eight-way skipped-hex host readers
        run: python3 tests/test-m203-bounded-batch.py BENCH M189
      - name: Compare M188 EOL fast path against M185 host
        run: python3 tests/test-m203-bounded-batch.py BENCH M188
      - name: Check M186 randomized skipped-record differential parity
        run: python3 tests/test-m203-bounded-batch.py M186
      - name: Check M187 synthetic 7736-object native closure
        run: python3 tests/test-m203-bounded-batch.py M187
      - name: Compare M181 M182 M183 M185 host skip readers
        run: python3 tests/test-m203-bounded-batch.py BENCH M185
      - name: Compare M181 M182 M183 skipped-body host timings
        run: python3 tests/test-m203-bounded-batch.py BENCH M184
      - name: Cross-check permanent CMS data disk safety runbook
        run: python3 tests/test-m203-bounded-batch.py M173R
      - name: Check read-only VMUDQ 6.3 source and fixed record model
        run: python3 tests/test-m203-bounded-batch.py M173V
      - name: Check Gate 6 protected activation and rollback states
        run: python3 tests/test-m203-bounded-batch.py NDATA M173-ACT
      - name: Guard M173 single-MDISK directory delta verifier
        run: python3 tests/test-m203-bounded-batch.py M173D
