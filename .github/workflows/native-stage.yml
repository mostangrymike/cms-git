name: Native staging host checks

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'archive/**'
      - '.github/workflows/native-stage.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'archive/**'
      - '.github/workflows/native-stage.yml'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Consolidated historical archive must contain six independently counted bundles.
      - name: Restore and verify historical CMS EXEC archives
        run: |
          python3 -m py_compile scripts/restore-cms-exec.py
          python3 scripts/restore-cms-exec.py MISSING
      - name: Audit all historical wrapper specifications before regeneration
        run: python3 scripts/restore-ph-wrappers.py CHECK
      - name: Verify wrapper safety gates under optimized Python
        run: python3 -O scripts/restore-ph-wrappers.py CHECK
      - name: Restore historical native tree wrappers
        run: python3 scripts/restore-ph-wrappers.py ALL
      - name: Test CP-to-Hercules read-only minidisk correlation
        run: bash tests/check-canonical-source.sh MAP
      - name: Test read-only Hercules config inventory
        run: bash tests/check-canonical-source.sh CONFIG
      - name: Test offline-only DASD backup safeguards
        run: bash tests/check-canonical-source.sh BACKUP
      - name: Enforce read-only CMS CATHEX gate and cleanup hold
        run: sh tests/check-canonical-source.sh READONLY
      - name: Reject unknown consolidated safety selectors
        run: |
          if sh tests/check-canonical-source.sh UNKNOWN; then exit 1; fi
          if sh tests/check-canonical-source.sh MAP EXTRA; then exit 1; fi
      - name: Check verified modern REF2 read-only bridge
        run: sh tests/check-canonical-source.sh VREF
      - name: Check compact CMS target gate source
        run: sh tests/check-canonical-source.sh M155
      - name: Check M156 authenticated presence duration
        run: python3 tests/test-m203-bounded-batch.py PHIST M156
      - name: Check M157 authenticated current presence age
        run: python3 tests/test-m203-bounded-batch.py PHIST M157
      - name: Check M158 authenticated presence time
        run: python3 tests/test-m203-bounded-batch.py PHIST M158
      - name: Check M159 authenticated presence ratio
        run: python3 tests/test-m203-bounded-batch.py PHIST M159
      - name: Check M160 authenticated presence coverage
        run: python3 tests/test-m203-bounded-batch.py PHIST M160
      - name: Check M161 authenticated presence frontier
        run: python3 tests/test-m203-bounded-batch.py PHIST M161
      - name: Check M162 authenticated frontier distance
        run: python3 tests/test-m203-bounded-batch.py PHIST M162
      - name: Check M163 authenticated complete presence horizon
        run: python3 tests/test-m203-bounded-batch.py PHIST M163
      - name: Check M164 practical CMS worktree porcelain
        run: python3 tests/test-m203-bounded-batch.py PMODEL M164
      - name: Check M165 staged commit object
        run: python3 tests/test-m203-bounded-batch.py PMODEL M165
      - name: Check M165 commit candidate handoff
        run: python3 tests/test-m165-commit-candidate.py
      - name: Check M166 modern REF2 compare-and-swap
        run: python3 tests/test-m203-bounded-batch.py PMODEL M166
      - name: Check M166 accepts the retained M165 commit OID
        run: python3 tests/test-m166-candidate-argument.py
      - name: Check M167 integrated commit to ref
        run: python3 tests/test-m203-bounded-batch.py PMODEL M167
      - name: Check M168 current branch reconciliation
        run: python3 tests/test-m203-bounded-batch.py GINTEG M168
      - name: Check M169 generalized fetch discovery
        run: python3 tests/test-m203-bounded-batch.py GINTEG M169
      - name: Check M170 dynamic upload pack POST
        run: python3 tests/test-m203-bounded-batch.py GINTEG M170
      - name: Check M171 generalized PACK store
        run: python3 tests/test-m203-bounded-batch.py GINTEG M171
      - name: Check M172 generalized PACK census
        run: python3 tests/test-m203-bounded-batch.py NDATA M172-MAIN
      - name: Check M173 generalized OFS PACK import
        run: python3 tests/test-m203-bounded-batch.py NDATA M173-IMP
      - name: Check M174 generalized stage index
        run: python3 tests/test-m203-bounded-batch.py NDATA M174-MAIN
      - name: Check M175 verified generalized object access
        run: python3 tests/test-m203-bounded-batch.py NDATA M175-MAIN
      - name: Check M176 verified live tree closure
        run: python3 tests/test-m203-bounded-batch.py NDATA M176-MAIN
      - name: Check M177 safe explicit G stage index read-only view
        run: python3 tests/test-m203-bounded-batch.py M177
      - name: Check M178 forward-only C89 tree closure parity
        run: python3 tests/test-m203-bounded-batch.py M178
      - name: Check M179 read-only native phase profiling parity
        run: python3 tests/test-m203-bounded-batch.py M179
      - name: Check M180 one-pass authenticated tree parity
        run: python3 tests/test-m203-bounded-batch.py M180
      - name: Check M181 hex LUT selective tree parity
        run: python3 tests/test-m203-bounded-batch.py M181
      - name: Check M182 two-character hex LUT parity
        run: python3 tests/test-m203-bounded-batch.py M182
      - name: Check M183 skipped-body length/unroll parity
        run: python3 tests/test-m203-bounded-batch.py M183
      - name: Check M185 direct skipped-record validation parity
        run: python3 tests/test-m203-bounded-batch.py M185
      - name: Check lossless native tree wrapper generation
        run: python3 scripts/restore-ph-wrappers.py CHECK
      - name: Check M188 fast EOL differential skip reader
        run: python3 tests/test-m203-bounded-batch.py M188
      - name: Check M190 one-pass validated selective seek readback
        run: python3 tests/test-m203-bounded-batch.py M190
      - name: Check M191 read-only direct indexed-seek CMS diagnostic
        run: python3 tests/test-m203-bounded-batch.py M191
      - name: Check M192 index-only CMS record-number arithmetic
        run: python3 tests/test-m203-bounded-batch.py M192
      - name: Check M193 assembler FSREAD static and record model safety
        run: python3 tests/test-m203-bounded-batch.py M193
      - name: Check M194 two-record FSREAD EBCDIC body safety
        run: python3 tests/test-m203-bounded-batch.py M194
      - name: Check M195 bounded LAST complete body reads
        run: python3 tests/test-m203-bounded-batch.py M195
      - name: Check M196 selected index object record plan
        run: python3 tests/test-m203-bounded-batch.py M196
      - name: Check M197 canonical full Git object SHA1 verifier
        run: python3 tests/test-m203-bounded-batch.py M197
      - name: Check M198 NEW-only scratch FSREAD to Git SHA bridge
        run: python3 tests/test-m203-bounded-batch.py M198
      - name: Check M199 bounded parameterized FSREAD object reader
        run: python3 tests/test-m203-bounded-batch.py M199
      - name: Check M200 CMS FILEDEF and exact A1 cleanup
        run: python3 tests/test-m203-bounded-batch.py M200
      - name: Check M201 compact native index-to-SHA plan
        run: python3 tests/test-m203-bounded-batch.py M201
      - name: Check M202 dual object full SHA and exact scratch cleanup
        run: python3 tests/test-m203-bounded-batch.py M202
      - name: Check M203 bounded batch Git SHA
        run: python3 tests/test-m203-bounded-batch.py M203
      - name: Check M204 index-once batch
        run: python3 tests/test-m203-bounded-batch.py M204
      - name: Check M205 sampled Git objects and full SHA1
        run: python3 tests/test-m203-bounded-batch.py M205
      - name: Check M206/M207 up to 128 independently SHA-authenticated bands
        run: python3 tests/test-m203-bounded-batch.py M206
      - name: Guard M206 explicit-object compatibility dispatch
        run: sh tests/check-canonical-source.sh M206BRIDGE
      - name: Install Regina REXX syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes regina-rexx
      - name: Check M210 REF2 tag listing and wildcard fixtures
        run: sh tests/check-canonical-source.sh M210
      - name: Check M213 REF2 ref-name validator parity
        run: sh tests/check-canonical-source.sh M213
      - name: Check M215 REF2 revision resolution
        run: sh tests/check-canonical-source.sh M215
      - name: Check M216 REF2 tag ordering
        run: sh tests/check-canonical-source.sh M216
      - name: Check M217 modern REF2 branch porcelain
        run: sh tests/check-canonical-source.sh M217
      - name: Check M218 guarded REF2 branch switching
        run: sh tests/check-canonical-source.sh M218
      - name: Check M219 mapped worktree switch preflight
        run: sh tests/check-canonical-source.sh M219
      - name: Check M190 7736-object selective seek closure
        run: python3 tests/test-m203-bounded-batch.py M190S
      - name: Compare M190 indexed seek vs M188 two-pass host
        run: python3 tests/test-m203-bounded-batch.py BENCH M190
      - name: Check M189 eight-way skipped-hex C89 parity
        run: python3 tests/test-m203-bounded-batch.py M189
      - name: Compare M189 eight-way skipped-hex host readers
        run: python3 tests/test-m203-bounded-batch.py BENCH M189
      - name: Compare M188 EOL fast path against M185 host
        run: python3 tests/test-m203-bounded-batch.py BENCH M188
      - name: Check M186 randomized skipped-record differential parity
        run: python3 tests/test-m203-bounded-batch.py M186
      - name: Check M187 synthetic 7736-object native closure
        run: python3 tests/test-m203-bounded-batch.py M187
      - name: Compare M181 M182 M183 M185 host skip readers
        run: python3 tests/test-m203-bounded-batch.py BENCH M185
      - name: Compare M181 M182 M183 skipped-body host timings
        run: python3 tests/test-m203-bounded-batch.py BENCH M184
      - name: Cross-check permanent CMS data disk safety runbook
        run: python3 tests/test-m203-bounded-batch.py M173R
      - name: Check read-only VMUDQ 6.3 source and fixed record model
        run: python3 tests/test-m203-bounded-batch.py M173V
      - name: Check Gate 6 protected activation and rollback states
        run: python3 tests/test-m203-bounded-batch.py NDATA M173-ACT
      - name: Guard M173 single-MDISK directory delta verifier
        run: python3 tests/test-m203-bounded-batch.py M173D
      - name: Guard CMS storage mode for live PACK artifacts
        run: python3 tests/test-m203-bounded-batch.py M173S
      - name: Compile every consolidated original historical host test
        run: python3 tests/test-m203-bounded-batch.py CHECK
      - name: Verify push and PR watched paths remain identical
        run: sh tests/check-canonical-source.sh WORKFLOW
      - name: Verify watched paths under optimized Python
        run: PYTHONOPTIMIZE=1 sh tests/check-canonical-source.sh WORKFLOW
      - name: Audit all tracked live CMS source dependencies
        run: python3 scripts/restore-cms-exec.py LIVEDEPS
      - name: Test CMS source inventory against duplicate and collision fixtures
        run: sh tests/check-canonical-source.sh LIVEPLANFIX
      - name: Inventory all CMS source consolidation candidates without deletion
        run: |
          python3 scripts/restore-cms-exec.py LIVEPLAN > cms-source-inventory.txt
          cat cms-source-inventory.txt
      - name: Preserve source inventory for consolidation review
        uses: actions/upload-artifact@v4
        with:
          name: cms-source-inventory
          path: cms-source-inventory.txt
          if-no-files-found: error
          retention-days: 30
      - name: Audit archived CMS EXEC references without modifying sources
        run: python3 scripts/restore-cms-exec.py AUDIT
      - name: Check CMS A cleanup exact allowlist
        run: python3 tests/test-m203-bounded-batch.py ACLEAN
      - name: Check combined compact M157 target gate
        run: sh tests/check-canonical-source.sh M157
      - name: Check neutral compiler EXEC source and F-disk setup
        run: sh tests/check-canonical-source.sh CMSCLNK
      - name: Reject native-text Git object headers in CMS C source
        run: sh tests/check-canonical-source.sh
      - name: Compile and fuzz interrupted writes in native C89 selector
        run: python3 tests/test-m203-bounded-batch.py SELECTOR
      - name: Check full 64-KiB binary CATHEX output and verified fallback
        run: python3 tests/test-m203-bounded-batch.py CATHEX
      - name: Verify complete binary Git tree parsing and recovery
        run: python3 tests/test-m203-bounded-batch.py NTREE
      - name: Compile and test staging, OID index and native REF PACK on host
        run: sh tests/check-canonical-source.sh NATIVE
